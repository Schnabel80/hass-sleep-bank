[project]
name = "hass-sleep-ledger"
version = "0.1.0a1"
description = "Home Assistant custom integration for long-term sleep debt, regularity and recovery analysis"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
lint = ["ruff>=0.15"]
typecheck = ["voluptuous>=0.14", "homeassistant>=2025.1.0", "ty"]
test = [
    "pytest>=8.0",
    "pytest-homeassistant-custom-component>=0.13.200",
]
dev = [
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "test"},
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
    "RUF",   # ruff-specific rules
    "ASYNC", # flake8-async
    "PERF",  # perflint
    "PGH",   # pygrep-hooks
    "G",     # flake8-logging
    "T20",   # flake8-print
    "TC",    # flake8-type-checking
]
ignore = [
    "RUF001", # ambiguous Unicode in strings (intentional: –, ×, etc.)
    "RUF002", # ambiguous Unicode in docstrings
    "RUF003", # ambiguous Unicode in comments
]

[tool.ruff.lint.per-file-ignores]
# Simulator und Bildmarken-Generator sind Entwickler-CLI-Werkzeuge und nicht Teil
# der Integration: print() ist dort die gewollte Ausgabe.
"simulator/*.py" = ["T201"]
"artwork/*.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
